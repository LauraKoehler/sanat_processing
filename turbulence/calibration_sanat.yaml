Pyau:
# Pyranometer and Pyrgeometer signal are amplified by Kipp&Zonen AMPBOX (with own SN) - Recorded are currents
# We need to trust the engineers, that the sensitivities of radiometers from the calibration certifiacates are correctly
# included in the "adjusted gain setting" entered in the Kipp&Zonen AMPBOX
# "adjusted gain setting" for the Pyranometers: 4-20mA represents -50 to 1950 W/m^2
  a0: -550.0
  a1: 125000.0
  a2: 0.0

